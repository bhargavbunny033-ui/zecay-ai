name: Build ZECAY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'ZECAY_AI_Android_APK_Ready*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "APK project ZIP file not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f -path '*/android/settings.gradle' | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found inside ZIP"
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $ANDROID_DIR"

      - name: Update Android Gradle Plugin
        shell: bash
        run: |
          sed -i "s/version '8.5.2'/version '8.6.0'/" "$ANDROID_DIR/build.gradle"
          cat "$ANDROID_DIR/build.gradle"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload ZECAY AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ZECAY-AI-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
