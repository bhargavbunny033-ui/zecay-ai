name: Build ZECAY AI Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Final ZIP
        shell: bash
        run: |
          if [ ! -f "ZECAY_AI_Android_APK_Ready_FINAL.zip" ]; then
            echo "ERROR: Final Android ZIP not found"
            exit 1
          fi

          echo "FINAL ZIP FOUND"
          ls -lh ZECAY_AI_Android_APK_Ready_FINAL.zip

      - name: Extract Final Android Project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "ZECAY_AI_Android_APK_Ready_FINAL.zip" -d extracted

          SETTINGS_FILE="$(find extracted -type f -path '*/android/settings.gradle' | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: android/settings.gradle not found"
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$ANDROID_DIR"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify ZECAY Live URL
        shell: bash
        run: |
          grep -R "https://zecay-ai.onrender.com" "$ANDROID_DIR/app/src/main" \
            || {
              echo "ERROR: ZECAY live URL not found in Android project"
              exit 1
            }

          echo "ZECAY live URL verified"

      - name: Build Final APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "FINAL ZECAY AI APK GENERATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload Final ZECAY AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ZECAY-AI-FINAL-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
